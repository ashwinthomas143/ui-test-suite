name: UI test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      # Always summarize, even on failure — this is the actual triage
      # step, not just a script sitting unused in the repo. No
      # ANTHROPIC_API_KEY is configured in this repo's CI secrets, so
      # this prints the plain pass/fail list; set the secret to get the
      # AI-grouped summary here too.
      - run: node scripts/summarize-results.js
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
