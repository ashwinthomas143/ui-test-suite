name: UI test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows, not Ubuntu — the visual-regression baseline
    # (ui/visual.spec.ts-snapshots/) was captured on Windows, and
    # Playwright's snapshot filenames are platform-suffixed
    # (-win32/-linux/-darwin), so a Linux runner has no matching
    # baseline to compare against. Matching the runner to the platform
    # the baseline is actually valid for, rather than generating a
    # second platform-specific baseline for a single-developer repo.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx playwright install --with-deps chromium

      # Generates ui/features/*.feature into real Playwright spec files
      # (.features-gen/) — the BDD scenario is just generated source,
      # not committed, so this must run before tests can find it.
      - run: npx bddgen

      - run: npx playwright test

      # Always summarize, even on failure — this is the actual triage
      # step, not just a script sitting unused in the repo. No
      # ANTHROPIC_API_KEY is configured in this repo's CI secrets, so
      # this prints the plain pass/fail list; set the secret to get the
      # AI-grouped summary here too.
      - run: node scripts/summarize-results.js
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
