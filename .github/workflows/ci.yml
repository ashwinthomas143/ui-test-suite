name: UI test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx tsc --noEmit

      # Cache the downloaded browser binary itself, keyed on the
      # Playwright version pinned in package-lock.json — a cache hit
      # skips re-downloading Chromium on every run; --with-deps still
      # runs to install OS-level libraries, which apt already caches.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}

      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # Generates ui/features/*.feature into real Playwright spec files
      # (.features-gen/) — the BDD scenario is just generated source,
      # not committed, so this must run before tests can find it.
      - run: npx bddgen

      - run: npx playwright test

      # Always summarize, even on failure — this is the actual triage
      # step, not just a script sitting unused in the repo. No
      # ANTHROPIC_API_KEY is configured in this repo's CI secrets, so
      # this prints the plain pass/fail list; set the secret to get the
      # AI-grouped summary here too.
      - run: node scripts/summarize-results.js
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
